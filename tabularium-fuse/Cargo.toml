[package]
name = "tabularium-fuse"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "FUSE mount adapter for tabularium RPC client"

[[bin]]
name = "tabularium-fuse"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
fuser = "0.14"
tabularium = { path = "../tabularium", default-features = false, features = ["client"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
